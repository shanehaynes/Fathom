name: Fathom
options:
  bundleIdPrefix: com.shanehaynes
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G44GWSXFK2
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 3
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Fathom:
    type: application
    platform: iOS
    sources:
      - path: Fathom
    dependencies:
      - target: FathomWidgets
        embed: true
    info:
      path: Fathom/Info.plist
      properties:
        CFBundleDisplayName: Fathom
        NSAlarmKitUsageDescription: Fathom schedules your two-phase wake alarms so they fire even when the app is closed.
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Deprecated on iOS 26 (build warning) yet still required by App Store
        # validation (ITMS-90474) for portrait-only apps. The validator wins.
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehaynes.fathom
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
  FathomWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: FathomWidgets
      - path: Fathom/Alarms/FathomMetadata.swift
      - path: Fathom/Scene/OceanScene.swift
      - path: Fathom/Theme/Theme.swift
    info:
      path: FathomWidgets/Info.plist
      properties:
        CFBundleDisplayName: Fathom Wake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shanehaynes.fathom.widgets
